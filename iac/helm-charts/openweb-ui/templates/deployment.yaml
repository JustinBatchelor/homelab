---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: openweb-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: ollama-container
          image: quay.io/jbatchel/openweb-ui:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: OLLAMA_BASE_URL
              value: http://pve2.batchelor.live:11434
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      imagePullSecrets:
        - name: jbatchel-pull-secret
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1